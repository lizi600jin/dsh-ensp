name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node's npm cache requires a lockfile, and `npm ci` hard-fails
      # without one. Detect it first so a lockfile-less clone still works.
      - name: Detect lockfile
        id: lock
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package-lock.json yet; npm cache disabled for this run."
          fi

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "${{ steps.lock.outputs.has == 'true' && 'npm' || '' }}"

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "::warning::package.json not present yet; skipping install."
            exit 0
          fi
          if [ "${{ steps.lock.outputs.has }}" = "true" ]; then
            npm ci
          else
            # No lockfile: there is nothing to resolve, and peer deps are
            # optional, so a plain install is enough to make the tree usable.
            npm install --no-audit --no-fund
          fi

      # Every module is ESM, so a bare parse check catches broken imports
      # before the test runner gets a chance to trip over them.
      - name: Syntax check
        run: |
          if [ ! -d src ]; then
            echo "::notice::No src/ directory; skipping syntax check."
            exit 0
          fi
          # scripts/ ships in the tarball and is imported by the tests, so it
          # needs the same parse check as src/.
          for dir in src scripts; do
            [ -d "$dir" ] || continue
            find "$dir" -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          done

      - name: Test
        run: |
          if [ ! -f package.json ]; then
            echo "::warning::package.json not present yet; skipping tests."
            exit 0
          fi
          if [ "$(npm pkg get scripts.test)" = "{}" ]; then
            echo "::notice::No \"test\" script defined; skipping npm test."
            exit 0
          fi
          # `node --test <dir>` exits non-zero when the directory is absent, so
          # confirm there is something to run before invoking the script.
          if ! find tests -name '*.test.mjs' -print -quit 2>/dev/null | grep -q .; then
            echo "::notice::No test files under tests/; nothing to run yet."
            exit 0
          fi
          npm test

      # docs/SCENARIOS.md is generated. Catch the case where presets.mjs changed
      # but the checked-in copy of the doc was not regenerated.
      - name: Generated docs are current
        run: |
          if [ ! -f scripts/gen-scenarios-doc.mjs ]; then
            echo "::notice::No scenario doc generator; skipping."
            exit 0
          fi
          node scripts/gen-scenarios-doc.mjs --check
