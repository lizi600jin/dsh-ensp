name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node's npm cache requires a lockfile, and `npm ci` hard-fails
      # without one. Detect it first so a lockfile-less clone still works.
      - name: Detect lockfile
        id: lock
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package-lock.json yet; npm cache disabled for this run."
          fi

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "${{ steps.lock.outputs.has == 'true' && 'npm' || '' }}"

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "::warning::package.json not present yet; skipping install."
            exit 0
          fi
          if [ "${{ steps.lock.outputs.has }}" = "true" ]; then
            npm ci
          else
            # No lockfile: there is nothing to resolve, and peer deps are
            # optional, so a plain install is enough to make the tree usable.
            npm install --no-audit --no-fund
          fi

      # Every module is ESM, so a bare parse check catches broken imports
      # before the test runner gets a chance to trip over them.
      - name: Syntax check
        run: |
          if [ ! -d src ]; then
            echo "::notice::No src/ directory; skipping syntax check."
            exit 0
          fi
          # scripts/ ships in the tarball and is imported by the tests, so it
          # needs the same parse check as src/.
          for dir in src scripts; do
            [ -d "$dir" ] || continue
            find "$dir" -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          done

      - name: Test
        run: |
          if [ ! -f package.json ]; then
            echo "::warning::package.json not present yet; skipping tests."
            exit 0
          fi
          if [ "$(npm pkg get scripts.test)" = "{}" ]; then
            echo "::notice::No \"test\" script defined; skipping npm test."
            exit 0
          fi
          # `node --test <dir>` exits non-zero when the directory is absent, so
          # confirm there is something to run before invoking the script.
          if ! find tests -name '*.test.mjs' -print -quit 2>/dev/null | grep -q .; then
            echo "::notice::No test files under tests/; nothing to run yet."
            exit 0
          fi
          npm test

      # docs/SCENARIOS.md is generated. Catch the case where presets.mjs changed
      # but the checked-in copy of the doc was not regenerated.
      - name: Generated docs are current
        run: |
          if [ ! -f scripts/gen-scenarios-doc.mjs ]; then
            echo "::notice::No scenario doc generator; skipping."
            exit 0
          fi
          node scripts/gen-scenarios-doc.mjs --check

  # The product only runs on Windows (`dsh.bundle.platforms: ["win32"]`), yet the
  # job above never touches it. Two of the three CI failures before 0.5 were
  # Linux-only assumptions in the tests, which is the same blind spot seen from
  # the other side: nothing proved the Windows paths (path probing, the registry
  # lookup, PowerShell invocation) still worked. This job runs the same suite on
  # the platform the plugin actually ships for. One Node version is enough here;
  # the version matrix above is what covers Node compatibility.
  test-windows:
    name: Windows (Node 20)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path package.json)) {
            Write-Host "::warning::package.json not present yet; skipping install."
            exit 0
          }
          if ((Test-Path package-lock.json) -or (Test-Path npm-shrinkwrap.json)) {
            npm ci
          } else {
            npm install --no-audit --no-fund
          }

      - name: Syntax check
        shell: pwsh
        run: |
          if (-not (Test-Path src)) {
            Write-Host "::notice::No src/ directory; skipping syntax check."
            exit 0
          }
          foreach ($dir in @('src', 'scripts')) {
            if (-not (Test-Path $dir)) { continue }
            Get-ChildItem -Path $dir -Recurse -Filter *.mjs | ForEach-Object {
              node --check $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Test
        shell: pwsh
        run: |
          if (-not (Test-Path package.json)) {
            Write-Host "::warning::package.json not present yet; skipping tests."
            exit 0
          }
          if (-not (Get-ChildItem -Path tests -Filter *.test.mjs -Recurse -ErrorAction SilentlyContinue)) {
            Write-Host "::notice::No test files under tests/; nothing to run yet."
            exit 0
          }
          npm test

      - name: Generated docs are current
        shell: pwsh
        run: |
          if (-not (Test-Path scripts/gen-scenarios-doc.mjs)) {
            Write-Host "::notice::No scenario doc generator; skipping."
            exit 0
          }
          node scripts/gen-scenarios-doc.mjs --check
