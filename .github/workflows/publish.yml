name: Publish to npm

# Publishes on a GitHub release, and can be run by hand from the Actions tab.
#
# The version guard matters because a release often ships after the maintainer
# already published from their machine. Without it the job would fail on the
# duplicate version and leave a red mark on a release that is actually fine.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Check whether this version is already on the registry
        id: check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "dsh-ensp@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::dsh-ensp@$VERSION is already published; nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # The check above is a fast path, not a guarantee: a version that is still
      # being staged by a concurrent `npm publish` is not readable through
      # `npm view` yet, so the registry answers 409 (conflict) rather than the
      # job skipping. What this workflow promises is that the version ends up on
      # the registry, so a failed publish that is followed by the version becoming
      # visible is a success, and only a version that stays missing is a failure.
      - name: Publish
        if: steps.check.outputs.needed == 'true'
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if grep -q 'previously staged version' publish.log; then
            echo "::notice::dsh-ensp@$VERSION is already being staged; waiting for it to appear."
          fi
          for attempt in $(seq 1 20); do
            if npm view "dsh-ensp@$VERSION" version >/dev/null 2>&1; then
              echo "::warning::npm publish exited $status, but dsh-ensp@$VERSION is on the registry; treating it as published."
              exit 0
            fi
            sleep 6
          done
          echo "::error::dsh-ensp@$VERSION is not on the registry after the publish attempt."
          exit "$status"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report missing token
        if: steps.check.outputs.needed == 'true' && env.NODE_AUTH_TOKEN == ''
        run: |
          echo "::error::NPM_TOKEN secret is not set, so the publish step cannot authenticate."
          echo "Add it under Settings -> Secrets and variables -> Actions, or publish locally."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
